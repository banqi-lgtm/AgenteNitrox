<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso CRM | RED NITROX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #D90429;
      --primary-dark: #A3001B;
      --accent: #EF233C;
      --bg: #0F1115;
      --card-bg: #181B22;
      --text: #F8F9FA;
      --text-muted: #8D99AE;
      --border: #2B2F3A;
      --error: #FF4D4F;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: radial-gradient(circle at top right, #1F1115, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(217, 4, 41, 0.15);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      border: 1px solid rgba(217, 4, 41, 0.3);
    }
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .brand-title span {
      color: var(--accent);
    }
    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #DDE2EC;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: #111318;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(239, 35, 60, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(217, 4, 41, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-alert {
      display: none;
      background: rgba(255, 77, 79, 0.15);
      border: 1px solid rgba(255, 77, 79, 0.3);
      color: var(--error);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    .footer-help {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .footer-help a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-help a:hover {
      text-decoration: underline;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-badge">⚡ Portal Administrativo</div>
      <h1 class="brand-title">RED <span>NITROX</span></h1>
      <p class="brand-subtitle">Gestión de Mecánicos y Talleres – Piloto Medellín</p>
    </div>

    <div id="errorAlert" class="error-alert">Credenciales incorrectas</div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Correo Administrativo</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-control" placeholder="administrador@nitrox.com" required value="administrador@nitrox.com">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Ingresar al CRM</span>
      </button>
    </form>

    <div class="footer-help">
      ¿Necesitas registrar un mecánico? <a href="/formulario">Abrir Formulario Virtual</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const loginBtn = document.getElementById('loginBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Verificando...';
      loginBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('nitrox_admin_token', data.token);
          window.location.href = '/crm';
        } else {
          errorAlert.textContent = data.message || 'Usuario o contraseña no válidos';
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = 'Error de conexión con el servidor';
        errorAlert.style.display = 'block';
      } finally {
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Ingresar al CRM';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
